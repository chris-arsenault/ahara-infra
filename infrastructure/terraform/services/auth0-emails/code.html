<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>${title}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2030;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:8px;">
            <tr>
              <td style="background:#0a0a0f;border-radius:8px 8px 0 0;padding:20px 32px;">
                <span style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:22px;color:#818cf8;">Ahara</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;">${lead}</p>
                <p style="margin:0 0 24px;font-size:32px;line-height:40px;font-weight:600;letter-spacing:6px;">{{ code }}</p>
                <p style="margin:0 0 8px;font-size:14px;line-height:20px;color:#55576b;">The code works for 15 minutes.</p>
                <p style="margin:0;font-size:14px;line-height:20px;color:#55576b;">${ignore}</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;line-height:18px;color:#8a8c9e;">Sent by Ahara to {{ user.email }}. Replies to this address are not read.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
